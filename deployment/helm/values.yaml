# =============================================================================
# isA_Chain Blockchain Node - Base Helm Values (Aligned with isa-service)
# =============================================================================
name: blockchain-node
namespace: isa-cloud-staging

image:
  registry: harbor.local:30443
  repository: isa/blockchain-node
  tag: latest
  pullPolicy: IfNotPresent

port: 9944
metricsPort: 9944

replicas: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

autoscaling:
  enabled: false  # StatefulSet/Single-node RocksDB, manual scaling

health:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 15

service:
  type: ClusterIP

consul:
  enabled: true
  serviceName: blockchain-node
  metadata:
    api_path: /api/v1/chain
    chain_id: "15489"
    rpc_port: "9944"

observability:
  tempoHost: "tempo.isa-cloud-local.svc.cluster.local"
  tempoPort: "4317"
  lokiUrl: "http://loki.isa-cloud-local.svc.cluster.local:3100"
  isaEnv: "staging"

env:
  - name: CHAIN_ID
    value: "15489"
  - name: RPC_PORT
    value: "9944"
  - name: BLOCK_TIME_SECS
    value: "3"
  - name: DATA_DIR
    value: "/data"
  - name: PERSIST
    value: "true"
  - name: RUST_LOG
    value: "isa_chain=info"
  - name: NATS_URL
    value: "nats://nats.isa-cloud-staging.svc.cluster.local:4222"

# RocksDB persistent storage via isa-service PVC template
persistentVolumeClaims:
  - name: blockchain-data
    size: 10Gi
    accessModes:
      - ReadWriteOnce

volumeMounts:
  - name: blockchain-data
    mountPath: /data

volumes:
  - name: blockchain-data
    persistentVolumeClaim:
      claimName: blockchain-data

# Security contexts
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # RocksDB needs write access
  capabilities:
    drop: ["ALL"]
